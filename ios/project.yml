name: OpenHeavens
options:
  bundleIdPrefix: com.oxygne
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 2875PJ8MCU
    CODE_SIGN_STYLE: Automatic
targets:
  OpenHeavens:
    type: application
    platform: iOS
    sources:
      - path: OpenHeavens
    info:
      path: OpenHeavens/Info.plist
      properties:
        CFBundleDisplayName: Open Heavens
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio]
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Italic.ttf
          - Inter-Light.ttf
          - Inter-Medium.ttf
          - Inter-MediumItalic.ttf
          - Inter-SemiBold.ttf
          - Inter-SemiBoldItalic.ttf
          - Inter-Bold.ttf
          - Inter-BoldItalic.ttf
          - InterDisplay-SemiBold.ttf
          - InterDisplay-Bold.ttf
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.lifestyle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oxygne.openheavens
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: true
schemes:
  OpenHeavens:
    build:
      targets:
        OpenHeavens: all
    run:
      config: Debug
    archive:
      config: Release
